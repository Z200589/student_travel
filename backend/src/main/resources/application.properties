server.address=127.0.0.1
server.port=8087
spring.datasource.url=jdbc:h2:file:./data/voyager;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${VOYAGER_DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.error.include-message=never
spring.mvc.log-request-details=false
voyager.wechat.appid=${WECHAT_APP_ID:}
voyager.wechat.secret=${WECHAT_APP_SECRET:}
voyager.dev-login=false
